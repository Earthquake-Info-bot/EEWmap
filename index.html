function project(lon, lat) {
  const clampedLat = Math.max(-85, Math.min(85, lat));
  const x = lon * Math.PI / 180;
  const rad = clampedLat * Math.PI / 180;
  const y = Math.log(Math.tan(Math.PI / 4 + rad / 2));
  return { x, y: -y };
}

function getGeometryCoordinates(geometry, callback) {
  if (!geometry) return;

  function walk(value) {
    if (!Array.isArray(value)) return;

    if (value.length >= 2 && typeof value[0] === "number" && typeof value[1] === "number") {
      callback(value[0], value[1]);
      return;
    }

    for (const child of value) walk(child);
  }

  walk(geometry.coordinates);
}

function createBounds() {
  return {
    minX: Infinity,
    maxX: -Infinity,
    minY: Infinity,
    maxY: -Infinity
  };
}

function addToBounds(bounds, point) {
  bounds.minX = Math.min(bounds.minX, point.x);
  bounds.maxX = Math.max(bounds.maxX, point.x);
  bounds.minY = Math.min(bounds.minY, point.y);
  bounds.maxY = Math.max(bounds.maxY, point.y);
}

function finishBounds(bounds) {
  if (!Number.isFinite(bounds.minX)) {
    throw new Error("有効な座標がありません。");
  }

  bounds.centerX = (bounds.minX + bounds.maxX) / 2;
  bounds.centerY = (bounds.minY + bounds.maxY) / 2;
  bounds.width = bounds.maxX - bounds.minX;
  bounds.height = bounds.maxY - bounds.minY;
  return bounds;
}

function calculateBounds(data) {
  const bounds = createBounds();

  for (const feature of data.features) {
    getGeometryCoordinates(feature.geometry, (lon, lat) => {
      addToBounds(bounds, project(lon, lat));
    });
  }

  return finishBounds(bounds);
}

function getTargetCodes(data) {
  const nameToCode = new Map();

  for (const feature of features) {
    const name = String(feature.properties?.name ?? "");
    const code = String(feature.properties?.code ?? "");
    if (name && code) nameToCode.set(name, code);
  }

  const codes = new Set();

  for (const area of data.areas ?? []) {
    const pref = String(area.pref ?? "");
    const code = nameToCode.get(pref);
    if (code) codes.add(code);
  }

  return codes;
}

function calculateTargetBounds() {
  const bounds = createBounds();

  for (const feature of features) {
    const code = String(feature.properties?.code ?? "");
    if (!targetCodes.has(code)) continue;

    getGeometryCoordinates(feature.geometry, (lon, lat) => {
      addToBounds(bounds, project(lon, lat));
    });
  }

  if (epicenterPoint) addToBounds(bounds, epicenterPoint);
  if (!Number.isFinite(bounds.minX)) return mapBounds;
  return finishBounds(bounds);
}

function getRings(geometry) {
  const result = [];

  function addPolygon(polygon) {
    for (const ring of polygon) result.push(ring);
  }

  if (geometry.type === "Polygon") {
    addPolygon(geometry.coordinates);
  } else if (geometry.type === "MultiPolygon") {
    for (const polygon of geometry.coordinates) addPolygon(polygon);
  }

  return result;
}

function makePath(feature) {
  const path = new Path2D();

  for (const ring of getRings(feature.geometry)) {
    if (!ring.length) continue;

    const first = project(ring[0][0], ring[0][1]);
    path.moveTo(first.x, first.y);

    for (let i = 1; i < ring.length; i++) {
      const point = project(ring[i][0], ring[i][1]);
      path.lineTo(point.x, point.y);
    }

    path.closePath();
  }

  return path;
}

function setInitialView() {
  if (!mapBounds || !canvasWidth || !canvasHeight) return;

  const bounds = targetBounds || mapBounds;
  const padding = Math.min(canvasWidth, canvasHeight) * 0.09;
  const availableWidth = Math.max(1, canvasWidth - padding * 2);
  const availableHeight = Math.max(1, canvasHeight - padding * 2);
  const targetWidth = Math.max(bounds.width * fitScale, 1);
  const targetHeight = Math.max(bounds.height * fitScale, 1);

  const scaleX = availableWidth / targetWidth;
  const scaleY = availableHeight / targetHeight;

  camera.scale = Math.min(scaleX, scaleY, 30);
  camera.x = -(bounds.centerX - mapBounds.centerX) * fitScale * camera.scale;
  camera.y = -(bounds.centerY - mapBounds.centerY) * fitScale * camera.scale;

  initialViewSet = true;
  requestDraw();
}

function resizeCanvas() {
  const rect = mapArea.getBoundingClientRect();
  canvasWidth = rect.width;
  canvasHeight = rect.height;

  // 端末の画素密度に合わせてCanvasの内部解像度を確保
  dpr = Math.min(window.devicePixelRatio || 1, 3);

  canvas.width = Math.round(canvasWidth * dpr);
  canvas.height = Math.round(canvasHeight * dpr);

  if (mapBounds) {
    const padding = Math.min(canvasWidth, canvasHeight) * 0.07;

    fitScale = Math.min(
      (canvasWidth - padding * 2) / mapBounds.width,
      (canvasHeight - padding * 2) / mapBounds.height
    );

    if (!initialViewSet) setInitialView();
  }

  fitAreaList();
  requestDraw();
}

function fitAreaList() {
  if (!areaList) return;

  const maxSize = Math.min(areaList.clientWidth * 0.085, areaList.clientHeight * 0.11);
  const minSize = Math.max(8, areaList.clientWidth * 0.035);
  areaList.style.fontSize = maxSize + "px";

  let size = maxSize;

  while (
    size > minSize &&
    (areaList.scrollHeight > areaList.clientHeight + 1 ||
     areaList.scrollWidth > areaList.clientWidth + 1)
  ) {
    size -= 0.5;
    areaList.style.fontSize = size + "px";
  }
}

function updateAreaList(data) {
  const areaSet = new Set();

  for (const area of data.areas ?? []) {
    let found = false;

    for (const [pref, keywords] of Object.entries(prefMap)) {
      if (keywords.some(keyword => String(area.name ?? "").includes(keyword))) {
        areaSet.add(pref);
        found = true;
        break;
      }
    }

    if (!found && area.name) areaSet.add(area.name);
  }

  for (const [region, prefs] of Object.entries(regionMap1)) {
    if (prefs.every(pref => areaSet.has(pref))) {
      prefs.forEach(pref => areaSet.delete(pref));
      areaSet.add(region);
    }
  }

  const areaSetFilter = regionOrder.filter(pref => areaSet.has(pref));
  areaList.replaceChildren();

  for (const name of areaSetFilter) {
    const span = document.createElement("span");
    span.className = "area-name";
    span.textContent = name;
    areaList.appendChild(span);
  }

  fitAreaList();
}

function setAlertText(data) {
  alertText.replaceChildren();

  if (data.cancelled === true) {
    const line = document.createElement("div");
    line.textContent = "先ほどの緊急地震速報はキャンセルされました。強い揺れの心配はありません。";
    alertText.appendChild(line);
    return;
  }

  const hypocenter = String(data.earthquake?.hypocenter?.reduceName ?? "震源地不明").trim();
  const isAssumed = data.earthquake?.condition === "仮定震源要素";

  const locationLine = document.createElement("div");
  locationLine.className = "location";

  const locationName = document.createElement("span");
  locationName.textContent = hypocenter;

  const locationSuffix = document.createElement("span");
  locationSuffix.className = "location-suffix";
  locationSuffix.textContent = `で${isAssumed ? "揺れ" : "地震"}`;

  locationLine.append(locationName, locationSuffix);
  alertText.appendChild(locationLine);

  for (const text of ["強い揺れに警戒", "姿勢を低くして頭を守って"]) {
    const line = document.createElement("div");
    line.className = "guidance";
    line.textContent = text;
    alertText.appendChild(line);
  }
}

function updateStatusBadges(isTest = false, isPast = false) {
  testBadge.classList.toggle("visible", isTest);
  pastBadge.classList.toggle("visible", isPast);
}

function showCenterMessage(title, detail = "", type = "normal") {
  centerMessageTitle.textContent = title;
  centerMessageDetail.textContent = detail;
  centerMessage.classList.toggle("error", type === "error");
  centerMessage.hidden = false;
}

function hideCenterMessage() {
  centerMessage.hidden = true;
  centerMessage.classList.remove("error");
}

function setMapTransform() {
  const scale = fitScale * camera.scale;
  const offsetX = canvasWidth / 2 - mapBounds.centerX * scale + camera.x;
  const offsetY = canvasHeight / 2 - mapBounds.centerY * scale + camera.y;

  ctx.setTransform(
    dpr * scale,
    0,
    0,
    dpr * scale,
    dpr * offsetX,
    dpr * offsetY
  );
}

function drawEpicenter() {
  if (!epicenterPoint) return;

  const scale = fitScale * camera.scale;
  const x = canvasWidth / 2 + (epicenterPoint.x - mapBounds.centerX) * scale + camera.x;
  const y = canvasHeight / 2 + (epicenterPoint.y - mapBounds.centerY) * scale + camera.y;

  // 地図描画領域の短辺に対する比率でマーカーサイズを決定
  const size = Math.min(canvasWidth, canvasHeight) * 0.024;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  ctx.translate(x, y);

  // 震源マーカーの線端と接合部を丸くする
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (assumedEpicenter) {
    ctx.strokeStyle = COLORS.epicenterOutline;
    ctx.lineWidth = size * 0.91;
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = COLORS.epicenterBorder;
    ctx.lineWidth = size * 0.64;
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = COLORS.epicenter;
    ctx.lineWidth = size * 0.36;
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    const drawCross = (color, width) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(-size, -size);
      ctx.lineTo(size, size);
      ctx.moveTo(size, -size);
      ctx.lineTo(-size, size);
      ctx.stroke();
    };

    drawCross(COLORS.epicenterOutline, size * 0.91);
    drawCross(COLORS.epicenterBorder, size * 0.64);
    drawCross(COLORS.epicenter, size * 0.36);
  }

  ctx.restore();
}

function draw() {
  animationRequested = false;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = COLORS.background;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!mapPaths.length || !mapBounds) return;

  setMapTransform();

  for (const item of mapPaths) {
    const isTarget = targetCodes.has(item.code);
    ctx.fillStyle = isTarget ? COLORS.target : COLORS.normal;
    ctx.fill(item.path, "evenodd");
  }

  // 境界線は地物ごとに1回だけ描画
  const boundaryWidth = Math.min(canvasWidth, canvasHeight) * 0.003;

  for (const item of mapPaths) {
    const isTarget = targetCodes.has(item.code);
    ctx.strokeStyle = isTarget ? COLORS.targetBorder : COLORS.normalBorder;
    ctx.lineWidth = boundaryWidth / (fitScale * camera.scale);
    ctx.stroke(item.path);
  }

  drawEpicenter();
}

function requestDraw() {
  if (animationRequested) return;
  animationRequested = true;
  requestAnimationFrame(draw);
}

function zoomAt(nextScale, x, y) {
  const newScale = Math.max(0.7, Math.min(30, nextScale));
  const ratio = newScale / camera.scale;

  camera.x = x - canvasWidth / 2 -
    (x - canvasWidth / 2 - camera.x) * ratio;

  camera.y = y - canvasHeight / 2 -
    (y - canvasHeight / 2 - camera.y) * ratio;

  camera.scale = newScale;
  requestDraw();
}

function resetView() {
  setInitialView();
}

function getPointerDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function getPointerCenter(a, b) {
  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };
}

canvas.addEventListener("wheel", event => {
  event.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;

  zoomAt(camera.scale * factor, x, y);
}, { passive: false });

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);

  const rect = canvas.getBoundingClientRect();
  const point = {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };

  pointers.set(event.pointerId, point);

  if (pointers.size === 1) {
    isDragging = true;
    dragStart = {
      pointer: point,
      cameraX: camera.x,
      cameraY: camera.y
    };
  } else if (pointers.size === 2) {
    const values = [...pointers.values()];
    const center = getPointerCenter(values[0], values[1]);

    pinchStart = {
      distance: getPointerDistance(values[0], values[1]),
      scale: camera.scale,
      anchorX: (center.x - canvasWidth / 2 - camera.x) / (fitScale * camera.scale),
      anchorY: (center.y - canvasHeight / 2 - camera.y) / (fitScale * camera.scale)
    };

    isDragging = false;
    dragStart = null;
  }
});

canvas.addEventListener("pointermove", event => {
  if (!pointers.has(event.pointerId)) return;
  event.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const point = {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };

  pointers.set(event.pointerId, point);

  if (pointers.size === 1 && isDragging && dragStart) {
    camera.x = dragStart.cameraX + point.x - dragStart.pointer.x;
    camera.y = dragStart.cameraY + point.y - dragStart.pointer.y;
    requestDraw();
  } else if (pointers.size === 2 && pinchStart) {
    const values = [...pointers.values()];
    const distance = getPointerDistance(values[0], values[1]);
    const center = getPointerCenter(values[0], values[1]);
    const ratio = distance / Math.max(1, pinchStart.distance);
    const newScale = Math.max(0.7, Math.min(30, pinchStart.scale * ratio));

    camera.scale = newScale;
    camera.x = center.x - canvasWidth / 2 - pinchStart.anchorX * fitScale * newScale;
    camera.y = center.y - canvasHeight / 2 - pinchStart.anchorY * fitScale * newScale;
    requestDraw();
  }
});

function endPointer(event) {
  pointers.delete(event.pointerId);

  if (pointers.size < 2) pinchStart = null;

  if (pointers.size === 1) {
    const remaining = [...pointers.values()][0];
    isDragging = true;
    dragStart = {
      pointer: remaining,
      cameraX: camera.x,
      cameraY: camera.y
    };
  } else {
    isDragging = false;
    dragStart = null;
  }
}

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("lostpointercapture", endPointer);

document.getElementById("zoomIn").addEventListener("click", () => {
  zoomAt(camera.scale * 1.25, canvasWidth / 2, canvasHeight / 2);
});

document.getElementById("zoomOut").addEventListener("click", () => {
  zoomAt(camera.scale / 1.25, canvasWidth / 2, canvasHeight / 2);
});

document.getElementById("reset").addEventListener("click", resetView);

mapArea.addEventListener("touchmove", event => {
  event.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", event => {
  if (event.target.closest("#mapArea")) event.preventDefault();
}, { passive: false });

async function copyScreenshot() {
  if (!window.html2canvas) {
    alert("スクリーンショット機能を読み込めませんでした。");
    return;
  }

  if (!navigator.clipboard?.write || typeof ClipboardItem === "undefined") {
    alert("このブラウザでは画像のコピーに対応していません。");
    return;
  }

  screenshotButton.disabled = true;
  const originalText = screenshotButton.textContent;
  screenshotButton.textContent = "作成中";

  try {
    const isMobile = window.matchMedia("(max-width: 768px)").matches;

    const screenshot = await html2canvas(document.getElementById("screen"), {
      backgroundColor: null,
      scale: isMobile ? 3 : 2,
      useCORS: true,
      logging: false,
      ignoreElements: element =>
        element.id === "controls" || element.id === "bottomActions"
    });

    const blob = await new Promise(resolve => screenshot.toBlob(resolve, "image/png"));

    if (!blob) throw new Error("画像を生成できませんでした。");

    await navigator.clipboard.write([
      new ClipboardItem({ "image/png": blob })
    ]);

    screenshotButton.textContent = "コピー完了";
  } catch (error) {
    console.error("スクリーンショットのコピーに失敗:", error);
    alert("スクリーンショットをコピーできませんでした。\n" + error.message);
    screenshotButton.textContent = originalText;
  } finally {
    screenshotButton.disabled = false;

    if (screenshotButton.textContent === "コピー完了") {
      setTimeout(() => {
        screenshotButton.textContent = originalText;
      }, 1500);
    }
  }
}

screenshotButton.addEventListener("click", copyScreenshot);

function parseIssueTime(value) {
  if (typeof value !== "string") return NaN;

  const normalized = value.trim().replace(/\//g, "-").replace(" ", "T");
  const withTimezone = /(?:Z|[+-]\d{2}:\d{2})$/i.test(normalized)
    ? normalized
    : normalized + "+09:00";

  return Date.parse(withTimezone);
}

function isExpired(data) {
  const issueTime = parseIssueTime(data.issue?.time);
  if (!Number.isFinite(issueTime)) return true;
  return Date.now() - issueTime >= EXPIRATION_TIME;
}

function formatElapsedTime() {
  if (!lastPollAt) return "未取得";
  const seconds = Math.max(0, Math.floor((Date.now() - lastPollAt) / 1000));
  return `${seconds}秒前に取得`;
}

function updatePollingButton() {
  if (pollingEnabled) {
    pollingButton.textContent = `ポーリング中 ${formatElapsedTime()}`;
  } else {
    pollingButton.textContent = "ポーリング開始";
  }
}

function unlockAudio() {
  alertAudio.muted = true;
  const promise = alertAudio.play();

  if (promise && typeof promise.then === "function") {
    promise.then(() => {
      alertAudio.pause();
      alertAudio.currentTime = 0;
      alertAudio.muted = false;
    }).catch(error => {
      alertAudio.muted = false;
      console.warn("音声の初期化に失敗:", error);
    });
  } else {
    alertAudio.pause();
    alertAudio.currentTime = 0;
    alertAudio.muted = false;
  }
}

function startPolling() {
  if (pollingEnabled) return;

  pollingEnabled = true;
  unlockAudio();
  updatePollingButton();

  pollEarthquakeData();
  pollingTimer = setInterval(pollEarthquakeData, POLL_INTERVAL);
  pollingClockTimer = setInterval(updatePollingButton, 250);
}

function stopPolling() {
  pollingEnabled = false;

  if (pollingTimer) {
    clearInterval(pollingTimer);
    pollingTimer = null;
  }

  if (pollingClockTimer) {
    clearInterval(pollingClockTimer);
    pollingClockTimer = null;
  }

  updatePollingButton();
}

pollingButton.addEventListener("click", () => {
  if (pollingEnabled) {
    stopPolling();
  } else {
    startPolling();
  }
});

async function playAlertSound() {
  try {
    alertAudio.pause();
    alertAudio.currentTime = 0;
    alertAudio.muted = false;
    await alertAudio.play();
  } catch (error) {
    console.error("サイレン音の再生に失敗:", error);
  }
}

async function testAlertSound() {
  if (testSoundButton.disabled) return;

  testSoundButton.disabled = true;
  testSoundButton.textContent = "再生中";

  try {
    await playAlertSound();
  } finally {
    setTimeout(() => {
      testSoundButton.disabled = false;
      testSoundButton.textContent = "音声テスト";
    }, 600);
  }
}

testSoundButton.addEventListener("click", testAlertSound);

function checkForNewIssue(data) {
  const currentIssueTime = parseIssueTime(data?.issue?.time);
  if (!Number.isFinite(currentIssueTime)) return;

  if (lastObservedIssueTime === null) {
    lastObservedIssueTime = currentIssueTime;
    return;
  }

  if (currentIssueTime > lastObservedIssueTime && data.cancelled !== true) {
    playAlertSound();
  }

  if (currentIssueTime > lastObservedIssueTime) {
    lastObservedIssueTime = currentIssueTime;
  }
}

function showNoAlert() {
  hasActiveAlert = false;
  isPastInformation = false;
  targetCodes.clear();
  epicenterPoint = null;
  assumedEpicenter = false;
  targetBounds = null;

  header.textContent = "緊急地震速報（気象庁）";
  alertText.replaceChildren();

  areaDivider.style.display = "none";
  areaList.replaceChildren();
  mapStatus.textContent = "待機中";

  updateStatusBadges(false, false);
  showCenterMessage("緊急地震速報は発表されていません。", "待機中");

  // 表示状態を初期化し、地図も初期表示に戻す
  initialViewSet = false;
  camera = { scale: 1, x: 0, y: 0 };
  resizeCanvas();
}

function applyEarthquakeData(data) {
  if (!data) {
    latestEventKey = null;
    showNoAlert();
    return;
  }

  const expired = isExpired(data);

  // ポーリング中は15分以上経過した情報を表示しない
  if (expired && pollingEnabled) {
    latestEventKey = null;
    showNoAlert();
    return;
  }

  // ポーリング停止中も期限切れ情報は原則表示しない
  // このreturnをコメントアウトすると、過去情報として表示できる  # testing
  if (expired) return;

  isPastInformation = expired;

  const issueSerial = data.cancelled === true
    ? "取消"
    : String(data.issue?.serial ?? "報数不明");

  const eventKey = [
    data.id ?? data.issue?.eventId ?? "",
    data.issue?.time ?? "",
    issueSerial
  ].join("_");

  const isNewEvent = eventKey !== latestEventKey;
  latestEventKey = eventKey;
  hasActiveAlert = true;

  hideCenterMessage();

  if (data.cancelled === true) {
    header.textContent = "緊急地震速報（取消）";
  } else if (data.test === true) {
    header.textContent = "緊急地震速報（試験配信）";
  } else {
    header.textContent = "緊急地震速報（気象庁）";
  }

  updateStatusBadges(data.test === true, isPastInformation);

  setAlertText(data);
  mapStatus.textContent = `${data.issue?.time ?? "不明"} #${issueSerial}`;

  if (data.cancelled === true) {
    targetCodes.clear();
    epicenterPoint = null;
    assumedEpicenter = false;
    targetBounds = null;
    areaDivider.style.display = "none";
    areaList.replaceChildren();
  } else {
    updateAreaList(data);
    targetCodes = getTargetCodes(data);

    const hypocenter = data.earthquake?.hypocenter;
    const latitude = Number(hypocenter?.latitude);
    const longitude = Number(hypocenter?.longitude);

    if (Number.isFinite(latitude) && Number.isFinite(longitude)) {
      epicenterPoint = project(longitude, latitude);
    } else {
      epicenterPoint = null;
    }

    assumedEpicenter = data.earthquake?.condition === "仮定震源要素";
    targetBounds = calculateTargetBounds();
    areaDivider.style.display = "block";
  }

  // 新しい報を受信した場合は、対象地域に合わせて毎回自動ズーム
  if (isNewEvent) {
    initialViewSet = false;
    camera = { scale: 1, x: 0, y: 0 };
    resizeCanvas();
  } else {
    requestDraw();
  }
}

function showFetchError(error, code) {
  console.error("緊急地震速報の取得エラー:", error);

  // エラー時は古い情報を残さず、表示状態を初期化
  latestData = null;
  latestEventKey = null;
  lastObservedIssueTime = null;
  showNoAlert();

  mapStatus.textContent = `エラーコード：${code}`;

  showCenterMessage(
    "緊急地震速報の情報を取得できません。",
    `エラーコード：${code}`,
    "error"
  );
}

async function refreshEarthquakeData(force = false) {
  // 通常のポーリングは取得中なら重複実行しない
  if (activeFetchPromise) {
    if (!force) return activeFetchPromise;

    // 手動更新の場合は実行中の取得完了を待ってから再取得
    await activeFetchPromise;
    return refreshEarthquakeData(false);
  }

  const request = (async () => {
    isFetching = true;
    updatePollingButton();

    try {
      const response = await fetch(API_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        const error = new Error(`P2P API取得失敗：HTTP ${response.status}`);
        error.code = `HTTP_${response.status}`;
        throw error;
      }

      let result;

      try {
        result = await response.json();
      } catch (error) {
        error.code = "INVALID_JSON";
        throw error;
      }

      if (!Array.isArray(result)) {
        const error = new Error("P2P APIの応答形式が正しくありません。");
        error.code = "INVALID_RESPONSE";
        throw error;
      }

      // 取得成功時点を記録
      lastPollAt = Date.now();
      latestData = result.length > 0 ? result[0] : null;

      if (pollingEnabled && latestData) {
        checkForNewIssue(latestData);
      } else if (latestData && lastObservedIssueTime === null) {
        // ポーリング開始前の初回取得を比較基準にする
        lastObservedIssueTime = parseIssueTime(latestData.issue?.time);
        if (!Number.isFinite(lastObservedIssueTime)) lastObservedIssueTime = null;
      }

      applyEarthquakeData(latestData);
    } catch (error) {
      const code = error.code ||
        (error instanceof TypeError ? "NETWORK_ERROR" : "FETCH_ERROR");

      showFetchError(error, code);
    } finally {
      isFetching = false;
      updatePollingButton();
    }
  })();

  activeFetchPromise = request;

  try {
    await request;
  } finally {
    if (activeFetchPromise === request) {
      activeFetchPromise = null;
    }
  }
}

function pollEarthquakeData() {
  refreshEarthquakeData();
}

async function manualRefresh() {
  if (refreshButton.disabled) return;

  refreshButton.disabled = true;
  const originalText = refreshButton.textContent;
  refreshButton.textContent = "更新中";

  latestData = null;
  latestEventKey = null;
  lastObservedIssueTime = null;
  showNoAlert();

  mapStatus.textContent = "情報を更新しています...";
  showCenterMessage("情報を更新しています...", "P2P APIからデータを取得しています。");

  try {
    // 取得中のポーリングがあれば完了を待ち、その後に手動取得
    await refreshEarthquakeData(true);
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = originalText;
  }
}

refreshButton.addEventListener("click", manualRefresh);

async function initialize() {
  try {
    const response = await fetch(GEOJSON_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`GeoJSON取得失敗：HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
      throw new Error("GeoJSONの形式が正しくありません。");
    }

    features = data.features.filter(feature =>
      feature.geometry &&
      ["Polygon", "MultiPolygon"].includes(feature.geometry.type)
    );

    if (!features.length) {
      throw new Error("描画可能な地物がありません。");
    }

    mapBounds = calculateBounds({ features });

    mapPaths = features.map(feature => ({
      path: makePath(feature),
      code: String(feature.properties?.code ?? "")
    }));

    resizeCanvas();

    if (!mapPaths.length) {
      throw new Error("地図の描画データを作成できませんでした。");
    }

    await refreshEarthquakeData();
  } catch (error) {
    console.error("初期化エラー:", error);

    const code = error instanceof TypeError ? "GEOJSON_NETWORK_ERROR" : "GEOJSON_ERROR";

    latestData = null;
    latestEventKey = null;
    showNoAlert();

    mapStatus.textContent = `エラーコード：${code}`;
    showCenterMessage(
      "地図データを取得できませんでした。",
      `エラーコード：${code} / ${error.message}`,
      "error"
    );
  }
}

const resizeObserver = new ResizeObserver(() => {
  resizeCanvas();
});

resizeObserver.observe(mapArea);
resizeObserver.observe(information);

updatePollingButton();
initialize();
</script>
